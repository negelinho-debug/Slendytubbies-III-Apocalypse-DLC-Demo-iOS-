
name: Apocalypse DLC - Restore Original Game Data

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout last working FIX 13
        uses: actions/checkout@v4
        with:
          ref: unity2021-compile-fix13
          fetch-depth: 0

      - name: Download original decoded PC data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/original
          gh run download 42066759094 \
            --repo "$GITHUB_REPOSITORY" \
            --name Apocalypse-Original-Mono-Recovery \
            --dir work/original

          test -f work/original/summary.json
          test -f work/original/recovery.csv

      - name: Restore original verified settings and action list
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          base = Path('Assets/MonoBehaviour')
          decoded = Path('work/original/decoded')
          original = {}

          for path in decoded.glob('resources.assets_*.json'):
              data = json.loads(
                  path.read_text(encoding='utf-8')
              )
              original[data.get('m_Name', '')] = data

          required = [
              'Slendytubbies 3_ActionsManager',
              'Slendytubbies 3_MenuManager',
              'Slendytubbies 3_SettingsManager',
          ]

          for name in required:
              if name not in original:
                  raise SystemExit(
                      'Missing original data: ' + name
                  )
              if not (base / (name + '.asset')).exists():
                  raise SystemExit(
                      'Missing Unity asset: ' + name
                  )

          def scalar(value):
              if isinstance(value, bool):
                  return '1' if value else '0'
              if isinstance(value, (int, float)):
                  return repr(value)
              if isinstance(value, str):
                  return json.dumps(
                      value, ensure_ascii=True
                  )
              raise TypeError('Unsupported field type')

          def write_fields(name, fields):
              path = base / (name + '.asset')
              contents = path.read_text(
                  encoding='utf-8-sig'
              )

              if 'm_EditorClassIdentifier:' not in contents:
                  raise SystemExit(
                      'Unexpected Unity asset: ' + str(path)
                  )

              for field, value in fields.items():
                  if not re.fullmatch(
                      r'[A-Za-z][A-Za-z0-9_]*', field
                  ):
                      raise SystemExit(
                          'Unsafe field name: ' + field
                      )

                  if isinstance(value, list):
                      if field not in (
                          'AllActions', 'EnabledActions'
                      ):
                          raise SystemExit(
                              'Unsupported list: ' + field
                          )

                      lines = ['  ' + field + ':']

                      for entry in value:
                          if set(entry) != {
                              'fileName',
                              'title',
                              'isEnabled'
                          }:
                              raise SystemExit(
                                  'Unknown ActionType layout'
                              )

                          lines.extend([
                              '  - fileName: ' +
                              scalar(entry['fileName']),

                              '    title: ' +
                              scalar(entry['title']),

                              '    isEnabled: ' +
                              scalar(entry['isEnabled']),
                          ])

                      rendered = '\n'.join(lines)

                  else:
                      rendered = (
                          '  ' + field + ': ' +
                          scalar(value)
                      )

                  pattern = re.compile(
                      r'^  ' + re.escape(field) +
                      r':[^\n]*(?:\n(?:(?:    |  - ).*))*',
                      flags=re.MULTILINE
                  )

                  if pattern.search(contents):
                      contents = pattern.sub(
                          lambda m: rendered,
                          contents,
                          count=1
                      )
                  else:
                      contents = (
                          contents.rstrip('\n') +
                          '\n' + rendered + '\n'
                      )

              path.write_text(
                  contents.rstrip('\n') + '\n',
                  encoding='utf-8'
              )

          # Original Adventure Creator actions
          actions = original[
              'Slendytubbies 3_ActionsManager'
          ]

          all_actions = actions['AllActions']
          enabled = actions['EnabledActions']

          if len(all_actions) != 85 or len(enabled) != 85:
              raise SystemExit(
                  'Original actions count changed'
              )

          if len({
              x['fileName'] for x in all_actions
          }) != 85:
              raise SystemExit(
                  'Duplicate original action names'
              )

          write_fields(
              'Slendytubbies 3_ActionsManager',
              {
                  'defaultClass': actions['defaultClass'],
                  'AllActions': all_actions,
                  'EnabledActions': enabled,
              }
          )

          # Restore original scalar game settings
          settings = original[
              'Slendytubbies 3_SettingsManager'
          ]

          safe_settings = {
              k: v for k, v in settings.items()
              if not k.startswith('m_')
              and type(v) in (
                  str, int, float, bool
              )
          }

          if len(safe_settings) < 50:
              raise SystemExit(
                  'Too few original settings'
              )

          write_fields(
              'Slendytubbies 3_SettingsManager',
              safe_settings
          )

          # Restore original MenuManager scalar settings
          menu = original[
              'Slendytubbies 3_MenuManager'
          ]

          write_fields(
              'Slendytubbies 3_MenuManager',
              {
                  'drawOutlines': menu['drawOutlines'],
                  'drawInEditor': menu['drawInEditor'],
                  'globalDepth': menu['globalDepth'],
              }
          )

          # Preserve scene GUIDs and working FIX13 controls.
          # Do not copy raw original PPtr object IDs.
          # The menu, cutscene, and animation references
          # still require proper Unity object remapping.

          report = '\n'.join([
              'APOCALYPSE DLC - ORIGINAL DATA RESTORE V1',
              'Source: original PC DEMO',
              '85 original actions restored.',
              f'{len(safe_settings)} original settings restored.',
              '3 MenuManager settings restored.',
              f'Original menu references pending: {len(menu["menus"])}',
              'Cutscene object references not yet remapped.',
              'MeshAnimator references not yet remapped.',
              'FIX13 scenes and touch controls preserved.',
              'This is not yet a complete playable DLC.',
              ''
          ])

          Path(
              'ORIGINAL_DATA_RESTORE_REPORT.txt'
          ).write_text(
              report,
              encoding='utf-8'
          )

          print(report)
          PY

      - name: Commit original data to separate branch
        shell: bash
        run: |
          set -euo pipefail

          branch=unity2021-original-data-v1

          if git ls-remote --exit-code \
            --heads origin "$branch" \
            >/dev/null 2>&1; then
            echo "Branch already exists: $branch"
            exit 1
          fi

          git switch -c "$branch"

          git add \
            'Assets/MonoBehaviour/Slendytubbies 3_ActionsManager.asset' \
            'Assets/MonoBehaviour/Slendytubbies 3_SettingsManager.asset' \
            'Assets/MonoBehaviour/Slendytubbies 3_MenuManager.asset' \
            ORIGINAL_DATA_RESTORE_REPORT.txt

          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git commit -m \
            'Restore verified original Apocalypse manager data'

          git push origin "$branch"

      - name: Upload restoration summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Apocalypse-Original-Data-Restore-Report
          path: ORIGINAL_DATA_RESTORE_REPORT.txt
          if-no-files-found: warn
