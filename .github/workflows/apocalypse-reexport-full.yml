
name: Apocalypse DLC - Original Mono Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout FIX 13
        uses: actions/checkout@v4
        with:
          ref: unity2021-compile-fix13

      - name: Download original PC game
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/game work/download work/report

          gh release download pc-recovery-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'slendytubbies-iii-the-apocalypse-dlc-demo-64bit.zip' \
            --dir work/download

          unzip -q work/download/*.zip -d work/game

          test -n "$(find work/game -name Assembly-CSharp.dll -print -quit)"
          test -n "$(find work/game -name globalgamemanagers -print -quit)"

      - name: Install original data recovery tools
        run: |
          python3 -m pip install \
            UnityPy==1.25.4 \
            TypeTreeGeneratorAPI==0.0.10

      - name: Decode original Mono behaviours
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import csv
          import json
          import UnityPy
          from UnityPy.helpers.TypeTreeGenerator import TypeTreeGenerator

          out = Path("work/report")
          decoded_dir = out / "decoded"
          decoded_dir.mkdir(parents=True, exist_ok=True)

          game = Path("work/game")
          dll = next(game.rglob("Assembly-CSharp.dll"))
          managed = dll.parent
          data = next(game.rglob("globalgamemanagers")).parent

          sources = sorted([
              p for p in data.iterdir()
              if p.is_file() and (
                  p.name == "globalgamemanagers"
                  or p.name == "resources.assets"
                  or p.name.startswith("sharedassets")
                     and p.suffix == ".assets"
                  or p.name.startswith("level")
                     and p.name[5:].isdigit()
              )
          ])

          if not sources:
              raise RuntimeError("Original asset files missing")

          sample = UnityPy.load(str(sources[0]))
          first_object = next(iter(sample.objects), None)

          if first_object is None:
              raise RuntimeError("Cannot detect Unity version")

          version = first_object.assets_file.unity_version
          print("Original Unity version:", version)

          generator = TypeTreeGenerator(version)
          generator.load_local_dll_folder(str(managed))

          targets = (
              "AC.Cutscene",
              "AC.Action",
              "AC.Interaction",
              "AC.AC_Trigger",
              "AC.SceneManager",
              "AC.SettingsManager",
              "AC.ActionsManager",
              "AC.MenuManager",
              "FSG.MeshAnimator",
              "NPCPatrol",
              "playerFPS",
          )

          counts = Counter()
          selected = Counter()
          records = []
          decoded = 0

          for source in sources:
              print("Reading:", source.name)
              try:
                  env = UnityPy.load(str(source))
                  env.typetree_generator = generator
              except Exception as exc:
                  records.append([
                      source.name, "FILE", "error",
                      0, "", str(exc)[:300]
                  ])
                  continue

              for obj in env.objects:
                  if obj.type.name != "MonoBehaviour":
                      continue

                  try:
                      head = obj.parse_monobehaviour_head()
                      script = head.m_Script.read()
                      if script is None:
                          continue

                      name = str(
                          getattr(script, "m_ClassName", "")
                      )
                      namespace = str(
                          getattr(script, "m_Namespace", "")
                      )
                      cls = (
                          namespace + "." if namespace else ""
                      ) + name

                  except Exception:
                      counts["header_failed"] += 1
                      continue

                  if not any(
                      cls == t or cls.startswith(t + ".")
                      for t in targets
                  ):
                      continue

                  if selected[cls] >= 20:
                      continue

                  selected[cls] += 1
                  counts["selected"] += 1

                  try:
                      tree = obj.parse_as_dict()

                      if not isinstance(tree, dict):
                          raise ValueError(
                              "Decoded result is not a dictionary"
                          )

                      keys = list(tree.keys())

                      if len(keys) <= 4:
                          raise ValueError(
                              "Only basic component header decoded"
                          )

                      decoded += 1
                      counts["decoded"] += 1

                      payload = json.dumps(
                          tree,
                          indent=2,
                          ensure_ascii=False,
                          default=str
                      )

                      if len(payload) < 2000000:
                          filename = (
                              f"{source.name}_"
                              f"{decoded:04d}.json"
                          )
                          (decoded_dir / filename).write_text(
                              payload, encoding="utf-8"
                          )

                      records.append([
                          source.name, cls, "decoded",
                          len(keys), ", ".join(keys[:50]), ""
                      ])

                  except Exception as exc:
                      counts["failed"] += 1
                      records.append([
                          source.name, cls, "failed",
                          0, "",
                          f"{type(exc).__name__}: {exc}"[:300]
                      ])

          with (out / "recovery.csv").open(
              "w", newline="", encoding="utf-8"
          ) as f:
              writer = csv.writer(f)
              writer.writerow([
                  "file", "class", "status",
                  "fields", "field_names", "error"
              ])
              writer.writerows(records)

          summary = {
              "original_unity_version": version,
              "original_assembly": dll.name,
              "files_scanned": len(sources),
              "results": dict(counts),
              "classes_checked": dict(selected),
              "decoded_json_files": len(
                  list(decoded_dir.glob("*.json"))
              ),
          }

          (out / "summary.json").write_text(
              json.dumps(summary, indent=2),
              encoding="utf-8"
          )

          print(json.dumps(summary, indent=2))

          if decoded == 0:
              raise RuntimeError(
                  "No original script data decoded. "
                  "Read recovery.csv for errors."
              )
          PY

      - name: Upload original recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Apocalypse-Original-Mono-Recovery
          path: work/report/
          retention-days: 14
          if-no-files-found: warn
