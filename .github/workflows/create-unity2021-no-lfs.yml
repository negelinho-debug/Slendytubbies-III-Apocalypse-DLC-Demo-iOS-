
name: Create Unity 2021 No LFS Branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-2021:
    runs-on: ubuntu-latest
    steps:
      - name: Create 2021 branch and set editor version
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const source = 'unity2019-no-lfs';
            const target = 'unity2021-no-lfs';
            const path = 'ProjectSettings/ProjectVersion.txt';

            const base = await github.rest.git.getRef({
              owner, repo, ref: `heads/${source}`
            });

            try {
              await github.rest.git.getRef({
                owner, repo, ref: `heads/${target}`
              });
              core.notice(`${target} already exists.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.git.createRef({
              owner, repo,
              ref: `refs/heads/${target}`,
              sha: base.data.object.sha
            });

            const file = await github.rest.repos.getContent({
              owner, repo, path, ref: target
            });

            if (Array.isArray(file.data) || !file.data.sha) {
              throw new Error('ProjectVersion.txt missing');
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: target,
              sha: file.data.sha,
              message: 'Prepare Unity 2021.3.45f2 branch',
              content: Buffer.from(
                'm_EditorVersion: 2021.3.45f2\n'
              ).toString('base64')
            });

            core.notice(`Created ${target} successfully.`);
