
name: Apocalypse PC - Export Unity Project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-unity:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Download original PC version from Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p work/download work/game

          gh release download pc-recovery-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'slendytubbies-iii-the-apocalypse-dlc-demo-64bit.zip' \
            --dir work/download

          unzip -q \
            work/download/slendytubbies-iii-the-apocalypse-dlc-demo-64bit.zip \
            -d work/game

      - name: Download AssetRipper CLI
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/assetripper

          curl -fL --retry 3 \
            -o work/AssetRipper_linux_x64.zip \
            'https://github.com/nowl-it/AssetRipperCLI/releases/download/v1.0.1/AssetRipper_linux_x64.zip'

          unzip -q \
            work/AssetRipper_linux_x64.zip \
            -d work/assetripper

      - name: Export original Unity project
        shell: bash
        run: |
          set -euo pipefail

          data_file="$(find work/game -type f -name globalgamemanagers -print -quit)"

          if [ -z "$data_file" ]; then
            echo "Unity game data not found"
            exit 1
          fi

          game_data="$(dirname "$data_file")"

          assetripper="$(find work/assetripper -type f \( -name 'AssetRipper' -o -name 'AssetRipper.GUI.Free' \) -print -quit)"

          if [ -z "$assetripper" ]; then
            echo "AssetRipper executable not found"
            exit 1
          fi

          chmod +x "$assetripper"

          mkdir -p work/export work/logs

          "$assetripper" --cli \
            --input "$game_data" \
            --output "$PWD/work/export" \
            --mode Unity \
            --script-content-level Level0 \
            2>&1 | tee work/logs/export.log

      - name: Package recovered Unity project
        shell: bash
        run: |
          set -euo pipefail

          if ! find work/export -type d -name Assets -print -quit | grep -q .; then
            echo "Unity Assets folder was not exported"
            exit 1
          fi

          tar -C work/export -czf \
            work/Apocalypse-Recovered-Unity-Project.tar.gz .

      - name: Upload recovered Unity project
        uses: actions/upload-artifact@v4
        with:
          name: Apocalypse-Recovered-Unity-Project
          path: work/Apocalypse-Recovered-Unity-Project.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Apocalypse-Export-Logs
          path: work/logs/
          retention-days: 7
          if-no-files-found: ignore
