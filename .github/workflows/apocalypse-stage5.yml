
name: Apocalypse DLC - Stage 5 Method Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-il2cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK from your Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input output

          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' \
            --dir input \
            --clobber

          test "$(find input -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          ls -lh input

      - name: Download official Cpp2IL Linux build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools

          TAG='2022.1.0-pre-release.21'

          gh api "repos/SamboyCoding/Cpp2IL/releases/tags/$TAG" \
            --jq '.assets[].name' \
            > tools/available-assets.txt

          cat tools/available-assets.txt

          ASSET="$(grep -E 'Linux(\.zip)?$|Linux-x64\.zip$' \
            tools/available-assets.txt \
            | grep -Eiv 'ARM64|arm64' \
            | head -n 1 || true)"

          if [ -z "$ASSET" ]; then
            echo 'Could not identify Linux x64 build'
            exit 1
          fi

          gh release download "$TAG" \
            --repo SamboyCoding/Cpp2IL \
            --pattern "$ASSET" \
            --dir tools \
            --clobber

          if [[ "$ASSET" == *.zip ]]; then
            mkdir -p tools/unpacked
            unzip -q "tools/$ASSET" -d tools/unpacked
          fi

          TOOL="$(find tools -type f \
            \( -name 'Cpp2IL*Linux' -o -name 'Cpp2IL' \) \
            ! -iname '*arm64*' | head -n 1)"

          if [ -z "$TOOL" ]; then
            echo 'Cpp2IL executable not located'
            find tools -maxdepth 3 -type f
            exit 1
          fi

          chmod +x "$TOOL"

          echo "CPP2IL_TOOL=$(realpath "$TOOL")" \
            >> "$GITHUB_ENV"

      - name: Analyze IL2CPP methods
        shell: bash
        run: |
          set -u
          mkdir -p output/recovered

          APK="$(find input -maxdepth 1 \
            -type f -name '*.apk' | head -n 1)"

          set +e

          timeout 1800 "$CPP2IL_TOOL" \
            --game-path "$APK" \
            --output-as dll_il_recovery \
            --output-to output/recovered \
            > output/cpp2il.log 2>&1

          STATUS=$?

          set -e

          {
            echo 'Slendytubbies III Apocalypse DLC'
            echo 'Stage 5 - IL2CPP analysis'
            echo "Cpp2IL exit code: $STATUS"
            echo "Output files: $(find output/recovered -type f | wc -l)"
            echo 'Recovered DLLs may contain placeholder code.'
            echo 'This is NOT a working IPA.'
          } > output/summary.txt

          tail -n 70 output/cpp2il.log
          cat output/summary.txt

          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

      - name: Upload Cpp2IL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Apocalypse-Stage5-Method-Report
          path: output/
          if-no-files-found: warn
          retention-days: 7
