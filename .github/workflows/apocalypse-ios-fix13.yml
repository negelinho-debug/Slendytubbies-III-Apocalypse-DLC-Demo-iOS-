
name: Apocalypse DLC - FIX 13 Retry

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix13:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FIX 12
        uses: actions/checkout@v4
        with:
          ref: unity2021-compile-fix12
          fetch-depth: 0

      - name: Apply FIX 13
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin unity2021-compile-fix13 >/dev/null 2>&1; then
            echo 'FIX13 branch already exists. Inspect it rather than overwrite.'
            exit 1
          fi
          git switch -c unity2021-compile-fix13
          test -f 'Assets/CHAPTER 4/Scenes/DEMOLEVEL.unity'
          test -f 'Assets/Scripts/Assembly-CSharp/MainMenu.cs'
          mkdir -p Assets/Scripts

          cat > Assets/Scripts/ApocalypseFix13CampaignMove.cs <<'CS'
          using UnityEngine;
          using UnityEngine.SceneManagement;

          [DefaultExecutionOrder(10000)]
          public sealed class ApocalypseFix13CampaignMove : MonoBehaviour
          {
              AC.Player player;
              Vector2 move;
              Vector3 positionBefore;
              float nextReport;

              [RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.AfterSceneLoad)]
              static void Install()
              {
                  if (FindObjectOfType<ApocalypseFix13CampaignMove>() != null) return;
                  GameObject obj = new GameObject("FIX13 Campaign Touch Diagnostic");
                  DontDestroyOnLoad(obj);
                  obj.AddComponent<ApocalypseFix13CampaignMove>();
              }

              void Update()
              {
                  move = Vector2.zero;
                  if (SceneManager.GetActiveScene().name != "DEMOLEVEL") return;
                  if (player == null) player = FindObjectOfType<AC.Player>();
                  if (player == null) { Report("player=MISSING"); return; }
                  if (player.isCutscene()) { Report("cutscene=true"); return; }
                  positionBefore = player.transform.position;

                  foreach (Touch t in Input.touches)
                  {
                      if (t.phase == TouchPhase.Ended || t.phase == TouchPhase.Canceled) continue;
                      Vector2 p = new Vector2(t.position.x, Screen.height - t.position.y);
                      if (p.x < Screen.width * .40f && p.y > Screen.height * .48f)
                      {
                          Vector2 center = new Vector2(Screen.width * .16f, Screen.height * .79f);
                          move = Vector2.ClampMagnitude((p - center) / (Screen.height * .13f), 1f);
                          break;
                      }
                  }
                  Report("player=" + player.name + " move=" + move + " touches=" + Input.touchCount);
              }

              void LateUpdate()
              {
                  if (SceneManager.GetActiveScene().name != "DEMOLEVEL" || player == null) return;
                  if (player.isCutscene() || move.sqrMagnitude < .02f) return;

                  if (Vector3.Distance(positionBefore, player.transform.position) > .003f) return;

                  Vector3 delta = new Vector3(move.x, 0f, -move.y) * (2.3f * Time.deltaTime);
                  CharacterController cc = player.GetComponent<CharacterController>();
                  if (cc != null && cc.enabled) cc.Move(delta);
                  else
                  {
                      Rigidbody rb = player.GetComponent<Rigidbody>();
                      if (rb != null && !rb.isKinematic) rb.MovePosition(rb.position + delta);
                      else player.transform.position += delta;
                  }

                  // No free camera rotation in campaign.
              }

              void Report(string value)
              {
                  if (Time.unscaledTime < nextReport) return;
                  Debug.Log("[FIX13] " + value);
                  nextReport = Time.unscaledTime + 3f;
              }
          }
          CS

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('Assets/Scripts/Assembly-CSharp/MainMenu.cs')
          s = p.read_text(encoding='utf-8-sig')

          pattern = r'(?m)^[ \t]*GUI\.Box\([\s\S]{0,600}?FIX 10 - ORIGINAL SCENE RECOVERY"\s*\);'
          s, count = re.subn(
              pattern,
              '\t\t\tGUI.Label(new Rect(w*.25f,h*.13f,w*.5f,h*.12f), "APOCALYPSE DLC - FIX 13");',
              s,
              count=1
          )

          print('[FIX13] Large panel removed:', count)
          if count == 0:
              print('[FIX13] Panel source differs; preserving it rather than corrupting menu')

          for before, after in [
              ('new Rect(w*.27f,h*.37f,w*.46f,h*.15f)',
               'new Rect(w*.3f,h*.39f,w*.4f,h*.12f)'),
              ('new Rect(w*.27f,h*.57f,w*.46f,h*.15f)',
               'new Rect(w*.3f,h*.56f,w*.4f,h*.12f)')
          ]:
              if before in s:
                  s = s.replace(before, after, 1)

          p.write_text(s, encoding='utf-8')

          for file in [
              'Assets/Scripts/ApocalypseDiagnostics9.cs',
              'Assets/Editor/ApocalypseDiagnostics9Build.cs'
          ]:
              p = Path(file)
              s = p.read_text(encoding='utf-8-sig')
              s = s.replace('Apocalypse-FIX12', 'Apocalypse-FIX13')
              s = s.replace('APOCALYPSE FIX 12', 'APOCALYPSE FIX 13')
              s = s.replace('Apocalypse FIX 12', 'Apocalypse FIX 13')
              p.write_text(s, encoding='utf-8')

          print('[FIX13] Original scenes, cameras and icon preserved')
          PY

          git add Assets/Scripts/ApocalypseFix13CampaignMove.cs \
                  Assets/Scripts/Assembly-CSharp/MainMenu.cs \
                  Assets/Scripts/ApocalypseDiagnostics9.cs \
                  Assets/Editor/ApocalypseDiagnostics9Build.cs

          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'FIX13 campaign movement and menu repair'
          git push origin unity2021-compile-fix13
