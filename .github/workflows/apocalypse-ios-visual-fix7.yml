
name: Apocalypse DLC iOS - Visual Fix 7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fix 6
        uses: actions/checkout@v4
        with:
          ref: unity2021-compile-fix6
          fetch-depth: 0

      - name: Create Fix 7 from Fix 6
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin unity2021-compile-fix7 >/dev/null; then
            echo 'Fix 7 branch already exists.'
            exit 1
          fi
          git switch -c unity2021-compile-fix7
          mkdir -p Assets/Scripts

          cat > Assets/Scripts/ApocalypseIOSVisualFix7.cs <<'CS'
          #if UNITY_IOS && !UNITY_EDITOR
          using System;
          using System.Collections;
          using UnityEngine;
          using UnityEngine.SceneManagement;

          public class ApocalypseIOSVisualFix7 : MonoBehaviour
          {
              [RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.AfterSceneLoad)]
              private static void Initialize()
              {
                  var go = new GameObject("Apocalypse iOS Visual Fix 7");
                  DontDestroyOnLoad(go);
                  go.AddComponent<ApocalypseIOSVisualFix7>();
              }

              private void Awake()
              {
                  Screen.orientation = ScreenOrientation.LandscapeLeft;
                  SceneManager.sceneLoaded += SceneLoaded;
              }

              private void Start() { StartCoroutine(CheckCameras()); }

              private void OnDestroy()
              {
                  SceneManager.sceneLoaded -= SceneLoaded;
              }

              private void SceneLoaded(Scene scene, LoadSceneMode mode)
              {
                  StartCoroutine(CheckCameras());
              }

              private IEnumerator CheckCameras()
              {
                  yield return null;
                  yield return null;
                  int active = 0;
                  Camera spareMain = null;

                  foreach (var camera in Resources.FindObjectsOfTypeAll<Camera>())
                  {
                      if (camera == null || !camera.gameObject.scene.IsValid()) continue;
                      if (camera.isActiveAndEnabled) active++;
                      if (camera.gameObject.CompareTag("MainCamera")) spareMain = camera;

                      foreach (var behaviour in camera.GetComponents<MonoBehaviour>())
                      {
                          if (behaviour == null) continue;
                          if (behaviour.GetType().Name.StartsWith(
                              "CameraFilterPack_", StringComparison.Ordinal))
                              behaviour.enabled = false;
                      }
                  }

                  if (active == 0 && spareMain != null)
                  {
                      spareMain.gameObject.SetActive(true);
                      spareMain.enabled = true;
                      active = 1;
                  }

                  if (spareMain != null && spareMain.isActiveAndEnabled)
                  {
                      if (spareMain.cullingMask == 0) spareMain.cullingMask = ~0;
                      if (spareMain.targetTexture != null) spareMain.targetTexture = null;
                  }

                  Debug.Log("[APOCALYPSE FIX7] Scene=" +
                      SceneManager.GetActiveScene().name + "; active cameras=" + active);
                  if (active == 0)
                      Debug.LogError("[APOCALYPSE FIX7] No active camera in this scene!");
              }
          }
          #endif
          CS

          python3 - <<'PY'
          from pathlib import Path
          p = Path('ProjectSettings/ProjectSettings.asset')
          text = p.read_text(encoding='utf-8')
          old = '  defaultScreenOrientation: 0'
          if old in text:
              p.write_text(text.replace(old, '  defaultScreenOrientation: 3', 1), encoding='utf-8')
          elif '  defaultScreenOrientation: 3' not in text:
              raise SystemExit('Unrecognized Unity screen orientation setting')

          settings = Path('ProjectSettings/EditorBuildSettings.asset').read_text()
          for scene in ('Chap4Menu.unity', 'Loading.unity', 'DEMOLEVEL.unity'):
              if scene not in settings:
                  raise SystemExit(f'Missing original DLC scene: {scene}')
          print('Verified original Apocalypse DLC scenes.')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Scripts/ApocalypseIOSVisualFix7.cs ProjectSettings/ProjectSettings.asset
          git commit -m 'Fix 7: iOS cameras, Metal image effects, landscape'
          git push origin unity2021-compile-fix7

      - name: Summary
        run: |
          echo '## Apocalypse DLC - Fix 7' >> "$GITHUB_STEP_SUMMARY"
          echo 'Branch: unity2021-compile-fix7' >> "$GITHUB_STEP_SUMMARY"
          echo 'In Unity Cloud Build select this branch, Unity 2021.3.45f2, iOS.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is a camera/graphics attempt, not a guaranteed gameplay fix.' >> "$GITHUB_STEP_SUMMARY"
